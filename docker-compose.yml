services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent}
      POSTGRES_DB: ${POSTGRES_DB:-agent}
    volumes:
      # postgres:18 declares /var/lib/postgresql as the volume (PGDATA lives at
      # /var/lib/postgresql/18/docker underneath it).
      - pgdata:/var/lib/postgresql
    ports:
      # Exposed so you can psql into the jobs table from the host.
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-agent}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: ./apps/backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agent}@db:5432/${POSTGRES_DB:-agent}
      # Required — the agent can't run without it. Fails fast if unset.
      ANTHROPIC_API_KEY: asdf #${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in your shell or .env}
      # Optional: without it, google_search returns its stub response.
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AGENT_MODEL: ${AGENT_MODEL:-claude-opus-4-8}
      AGENT_EFFORT: ${AGENT_EFFORT:-high}
      AGENT_MAX_ITERATIONS: ${AGENT_MAX_ITERATIONS:-20}
      AGENT_MAX_TOKENS: ${AGENT_MAX_TOKENS:-16000}
      # Browser origin allowed to call this API; the frontend's published URL.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      # Job sandboxes survive a container restart; jobs themselves live in postgres.
      - workspace:/data/workspace
    restart: unless-stopped

  frontend:
    build:
      context: ./apps/frontend
      args:
        # Inlined into the client bundle at build time. The browser calls the
        # backend directly via its published host port, not through the
        # compose network, so localhost:8000 is correct even in Docker.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - app
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  pgdata:
  workspace:
