[project]
name = "agent-playground"
version = "0.1.0"
description = "FastAPI server that runs Claude-powered agent jobs with filesystem and Google search tools"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.120.2",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "ruff>=0.16.1",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests/` imports both `app` and the root `main.py` launcher.
pythonpath = ["."]
# Async tests are plain `async def` — no per-test marker needed.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.ruff.lint]
# We log through loguru, which uses `{}` placeholders rather than %-style ones;
# the stdlib-logging format checks misread those as too many arguments.
ignore = ["PLE1205"]
